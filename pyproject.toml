[project]
name = "jev-zork"
version = "0.1.0"
description = "Jev (TypeSafe System One) plays Zork I: one Choice per move over Jericho's valid actions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Jericho only builds on Linux or macOS: on Windows, go through WSL.
    "jericho>=3.3.1; sys_platform != 'win32'",
    # Jericho loads this spaCy model to spot the objects in a room; without it, it
    # downloads it by itself on the first move. We pin it here.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform != 'win32'",
    # The SDK broke its API twice in one week: stay on 0.7.
    "typesafe-sdk>=0.7,<0.8",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Resadan-dev/jev-zork"
Issues = "https://github.com/Resadan-dev/jev-zork/issues"

[project.scripts]
jev-zork = "jev_zork.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: license field as an SPDX expression (PEP 639)
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/jev_zork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "jericho: needs Jericho and the Zork I ROM (WSL, Linux or macOS)",
]

[tool.coverage.run]
source = ["jev_zork"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
